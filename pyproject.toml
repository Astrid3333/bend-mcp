[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bend-mcp"
version = "0.1.1"
description = "Servidor MCP que expone el lenguaje Bend (HVM2 / interaction combinators) a Claude Desktop u otros clientes MCP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Astrid" }]
dependencies = [
    "mcp[cli]>=1.28.0,<2",
]

[project.scripts]
bend-mcp = "bend_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.urls]
Repository = "https://github.com/Astrid3333/bend-mcp"

[tool.pytest.ini_options]
testpaths = ["tests"]
