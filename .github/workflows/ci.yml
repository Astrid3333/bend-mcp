name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-no-bend:
    name: pytest (sin binario bend)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar paquete + dev
        run: pip install -e ".[dev]"
      - name: Pytest (tests de binario se saltan solos)
        run: pytest -v

  test-with-bend:
    name: pytest (con bend-lang 0.2.38)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Instalar bend-lang 0.2.38 (era clásica)
        run: cargo install bend-lang --version 0.2.38 --locked
      - name: Verificar versión
        run: bend --version
      - name: Instalar paquete + dev
        run: pip install -e ".[dev]"
      - name: Pytest completo
        run: pytest -v
